name: Nightly Rotating Refresh

on:
  schedule:
    # 07:37 UTC = 16:37 JST (Mon-Fri JST), after the 16:00 JST bar-confirmation
    # cutoff. Moved from 19:30 JST so the late-started run (7-10h in 2026-11)
    # lands before the 01:07 JST core instead of colliding with it on data/.
    - cron: "37 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run rotating refresh
        run: uv run python scripts/rotating_refresh.py --output docs/rotating_refresh_report.json --buckets 5

      - name: Commit and push rotating refresh outputs
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%F)
          bash .github/scripts/commit-and-push.sh "Nightly rotating refresh ($TODAY_JST)" data/ docs/rotating_refresh_report.json
