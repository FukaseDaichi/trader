name: Daily Preopen Retry

on:
  schedule:
    # 21:20 / 21:40 UTC = 06:20 / 06:40 JST (Mon-Fri JST)
    - cron: "20 21 * * 0-4"
    - cron: "40 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-core-main
  cancel-in-progress: false

jobs:
  preopen-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check JPX open day
        id: market
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%F)
          echo "today_jst=$TODAY_JST" >> "$GITHUB_OUTPUT"
          uv run python scripts/jpx_calendar.py is-open \
            --date "$TODAY_JST" \
            --cache-path data/jpx_holidays.json \
            --github-output

      - name: Check whether daily update already exists
        id: guard
        if: ${{ steps.market.outputs.is_open == 'true' }}
        run: |
          uv run python scripts/run_guard.py needs-core-run \
            --state-file docs/state.json \
            --date "${{ steps.market.outputs.today_jst }}" \
            --github-output

      - name: Skip on JPX close day
        if: ${{ steps.market.outputs.is_open != 'true' }}
        run: echo "JPX closed. Retry skipped."

      - name: Skip when core already completed
        if: ${{ steps.market.outputs.is_open == 'true' && steps.guard.outputs.needs_run != 'true' }}
        run: echo "Today's update already exists. Retry skipped."

      - name: Update macro snapshots
        if: ${{ steps.market.outputs.is_open == 'true' && steps.guard.outputs.needs_run == 'true' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_DB_ENABLED: "true"
          RUN_DATE_JST: ${{ steps.market.outputs.today_jst }}
        run: uv run python scripts/update_macro_snapshots.py --as-of "${{ steps.market.outputs.today_jst }}"

      - name: Run retry prediction script
        if: ${{ steps.market.outputs.is_open == 'true' && steps.guard.outputs.needs_run == 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RUN_DATE_JST: ${{ steps.market.outputs.today_jst }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_DB_ENABLED: "true"
          # Keep retry inference identical to core. Saved-model failures train
          # an exact-contract ephemeral candidate inside main.py.
          TRADER_MODEL_MODE: "auto"
          TRADER_TARGET_HORIZON_DAYS: "5"
          TRADER_LABEL_MODE: "triple_barrier"
          TRADER_CALIBRATION_MODE: "isotonic"
          TRADER_MACRO_FEATURES_ENABLED: "true"
          # Phase 2 remains shadow-only, but retry must publish today's snapshot
          # and measurement rows just like core.
          TRADER_PORTFOLIO_ENABLED: "true"
          TRADER_PORTFOLIO_MODE: "shadow"
          TRADER_NOTIFY_DIGEST_ENABLED: "true"
          TRADER_NOTIFY_PER_TICKER_ENABLED: "false"
          TRADER_NOTIFY_RETRY_MAX: "3"
        run: uv run python main.py

      - name: Settle realized outcomes
        if: ${{ steps.market.outputs.is_open == 'true' && steps.guard.outputs.needs_run == 'true' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADER_DB_ENABLED: "true"
          RUN_DATE_JST: ${{ steps.market.outputs.today_jst }}
        # Legacy-v1 refill only; contract-v2 benchmark remains fail-closed until
        # matching TOPIX open prices are available.
        run: uv run python scripts/settle_outcomes.py --as-of "${{ steps.market.outputs.today_jst }}" --refill-benchmark

      - name: Commit and push retry updates
        if: ${{ steps.market.outputs.is_open == 'true' && steps.guard.outputs.needs_run == 'true' }}
        run: |
          TODAY_JST="${{ steps.market.outputs.today_jst }}"
          bash .github/scripts/commit-and-push.sh "Retry daily update ($TODAY_JST)" data/ docs/
