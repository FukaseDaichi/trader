# Weekly dependency update PRs. Minor/patch bumps are grouped per ecosystem and
# auto-merged by dependabot-auto-merge.yml once CI Tests passes; major bumps and
# GitHub Actions bumps open as separate PRs for manual review.
#
# Schedule: Saturday 12:00 JST — after the weekly retrain (Sat 08:00 JST) and
# well before Monday's pre-open run, so a bad merge surfaces over the weekend.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    # Majors that cannot land yet (2026-10). Remove an entry once its blocker clears.
    ignore:
      # eslint-config-next's plugins (react / import / jsx-a11y) peer-depend on eslint <=9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) peer-depends on typescript <6.1; TS 7 also fails next build.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep in step with the Node 22 runtime in ci-tests.yml / daily-publish-dashboard.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns: ["*"]
