# Weekly dependency update PRs. Minor/patch bumps are grouped per ecosystem and
# auto-merged by dependabot-auto-merge.yml once CI Tests passes; major bumps and
# GitHub Actions bumps open as separate PRs for manual review.
#
# Schedule: Saturday 12:00 JST — after the weekly retrain (Sat 08:00 JST) and
# well before Monday's pre-open run, so a bad merge surfaces over the weekend.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns: ["*"]
